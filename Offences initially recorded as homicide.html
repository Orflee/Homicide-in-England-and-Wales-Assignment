<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" type="text/css" href="../css/style.css" media="screen"/>
        <link rel="stylesheet" type="text/css" href="../css/fonts.css" media="screen"/>
        <title>
            Homicide in England and Wales
        </title>
        <style>
            table {
                border-collapse: collapse;
                width: 100%;
            }
            th, td {
                border: 1px solid #dddddd;
                text-align: left;
                padding: 8px;
            }
        </style>
    </head>
    <body>
        <nav>
            <div>
                <i>
                    <a href="../index.html">Homicide in England and Wales</a>
                </i>
                <b>
                    Offences initially recorded as homicide by current classification
                </b>
            </div>
        </nav>
        <div id="view"></div>
        <main>
            <table id="csv-table">
                <thead>
                    <tr id="header-row"></tr>
                </thead>
                <tbody id="data-rows"></tbody>
            </table>
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    fetch('Offences initially recorded as homicide by current classification.php')
                        .then(response => response.json())
                        .then(data => {
                            const headerRow = document.getElementById('header-row');
                            data.headers.forEach(header => {
                                const th = document.createElement('th');
                                th.textContent = header;
                                headerRow.appendChild(th);
                            });
                            const dataRows = document.getElementById('data-rows');
                            data.rows.forEach(row => {
                                const tr = document.createElement('tr');
                                row.forEach(cell => {
                                    const td = document.createElement('td');
                                    td.textContent = cell;
                                    tr.appendChild(td);
                                });
                                dataRows.appendChild(tr);
                            });
                        })
                        .catch(error => console.error('Error fetching CSV data:', error));
                });
            </script>
        </main>
        <footer>
            <div>
                100664301 Aggelos Orfeas Kouroumlis  
            </div>
        </footer>
    </body>
</html>
